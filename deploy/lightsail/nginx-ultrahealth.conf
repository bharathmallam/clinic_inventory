# Ultrahealth Inventory on AWS Lightsail: the website and the API on one address.
# Installed by install.sh as /etc/nginx/sites-available/ultrahealth (__DOMAIN__ is filled in).
# `certbot --nginx` adds the HTTPS part to this file; install.sh keeps it on later runs.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Only the built website lives here. The backend, its settings and the backups
    # are in /srv/ultrahealth, which nginx never serves.
    root /var/www/ultrahealth;
    index index.html;

    server_tokens off;
    autoindex off;
    client_max_body_size 10m;          # spreadsheet imports arrive as JSON

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Anything that is not part of the website is refused, even if it is copied
    # here by mistake: documents, dumps, settings, archives, dot-files.
    location ~* \.(md|rtf|sql|log|db|sqlite3|env|ini|cnf|bak|zip|gz|py)$ { return 404; }
    location ~* ^/(guide|schema)\.html$ { return 404; }
    location ~ /\.(?!well-known/) { return 404; }

    # The Python app (Gunicorn), path passed through unchanged.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /api { return 404; }

    # Built files carry a hash in their name, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths open index.html, which is never cached so an
    # update is seen at once.
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }
}
